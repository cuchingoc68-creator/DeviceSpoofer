name: Build DeviceSpoofer

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: theos/theos-action@main
        with:
          toolchain: iOS-patched
          toolchain-cache: true
          sdk-cache: true

      - name: Build package
        run: |
          make package FINALPACKAGE=1 2>&1 | tee build.log
          echo "=== Packages ==="
          ls -la packages/ 2>/dev/null || echo "No packages folder"

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: DeviceSpoofer-deb
          path: packages/*.deb
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
